<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City of Orange Municipal Budget Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe3ee;
      --slate: #1e293b;
      --blue: #075985;
      --orange: #c2410c;
      --green: #166534;
      --red: #991b1b;
      --yellow: #854d0e;
      --link: #075985;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body, button, input, table { color: var(--ink); }
    a { color: var(--link); }
    strong { color: inherit; }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
    }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .hero { padding: 34px 0 30px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .hero h1 { margin: 0 0 8px; font-size: clamp(2.35rem, 5vw, 4rem); line-height: .95; letter-spacing: 0; }
    .hero h1 { color: #ffffff; }
    .hero p { margin: 0; color: #cbd5e1; font-size: 1.1rem; }
    .hero-meta { text-align: right; color: #cbd5e1; font-size: .95rem; }
    .hero-meta strong { color: #fb923c; display: block; margin-top: 6px; }
    .orange-rule { width: 128px; height: 4px; background: linear-gradient(90deg, #f97316, #fb923c); border-radius: 999px; margin-top: 18px; }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .tabs { display: flex; gap: 22px; overflow-x: auto; }
    .tab {
      appearance: none;
      border: 0;
      background: transparent;
      color: #475569;
      border-bottom: 2px solid transparent;
      padding: 16px 2px 14px;
      font-size: .9rem;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
      transition: color .18s ease, border-color .18s ease, transform .18s ease;
    }
    .tab:hover { color: #0f172a; transform: translateY(-1px); }
    .tab.active { color: #ea580c; border-bottom-color: #f97316; }
    .calc-button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 11px;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }
    .calc-button:hover { transform: translateY(-1px); border-color: #fb923c; }

    main { padding: 30px 0 56px; }
    section[hidden] { display: none; }
    .stack { display: grid; gap: 24px; animation: fadeUp .28s ease both; }
    .grid { display: grid; gap: 20px; }
    .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

    .panel, .metric, .project, .variance {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(15,23,42,.05);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .panel { padding: 22px; }
    .metric { padding: 22px; }
    .project, .variance { padding: 20px; }
    .panel:hover, .metric:hover, .project:hover, .variance:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(15,23,42,.08); }

    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .label { color: var(--muted); font-size: .75rem; font-weight: 850; text-transform: uppercase; letter-spacing: .045em; }
    .value { font-size: clamp(1.55rem, 3vw, 2.15rem); font-weight: 850; margin: 12px 0 4px; }
    .note { color: var(--muted); font-size: .86rem; line-height: 1.45; }
    .yoy { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: .88rem; font-weight: 800; }
    .orange { color: var(--orange); }
    .blue { color: var(--blue); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .yellow { color: var(--yellow); }
    .muted { color: var(--muted); }

    h2 { margin: 0 0 18px; font-size: 1.35rem; }
    h3 { margin: 0 0 10px; font-size: 1.05rem; }
    h4 { margin: 0 0 8px; }
    p { margin: 0; }
    h1, h2, h3, h4, .value { color: inherit; }
    main h2, main h3, main h4, main .value { color: var(--ink); }
    .panel-title { display: flex; align-items: center; gap: 10px; }
    .alert {
      border-left: 4px solid;
      padding: 18px 20px;
      border-radius: 0 8px 8px 0;
    }
    .alert.blue { background: #eff6ff; border-color: #2563eb; color: #1e3a8a; }
    .alert.yellow { background: #fefce8; border-color: #eab308; color: #713f12; }
    .alert.red { background: #fef2f2; border-color: #ef4444; color: #7f1d1d; }
    .alert.green { background: #f0fdf4; border-color: #22c55e; color: #14532d; }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; color: var(--ink); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; background: #f8fafc; }
    tr:last-child td { border-bottom: 0; }

    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 10px; font-size: .76rem; font-weight: 850; }
    .badge.green { background: #dcfce7; color: #14532d; }
    .badge.blue { background: #dbeafe; color: #1e3a8a; }
    .badge.orange { background: #ffedd5; color: #7c2d12; }
    .badge.red { background: #fee2e2; color: #7f1d1d; }
    .badge.yellow { background: #fef3c7; color: #713f12; }

    .bar-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #005fa3, #f97316); transform-origin: left; animation: growBar .8s ease both; }
    .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .kv div { background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    input {
      background: #ffffff;
      color: var(--ink);
      caret-color: var(--orange);
    }
    input::placeholder { color: #94a3b8; opacity: 1; }
    .chart-box { height: 360px; }
    .chart-box.tall { height: 430px; }
    canvas { width: 100% !important; height: 100% !important; }
    .icon { width: 22px; height: 22px; }
    .icon.orange { color: var(--orange); }
    .icon.blue { color: var(--blue); }
    .icon.green { color: var(--green); }
    .icon.red { color: var(--red); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (max-width: 980px) {
      .hero { display: block; }
      .hero-meta { text-align: left; margin-top: 18px; }
      .metrics, .two, .three { grid-template-columns: 1fr; }
      .tabs { gap: 16px; }
      .kv { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap hero">
      <div>
        <h1>City of Orange</h1>
        <p>Municipal Budget Dashboard 2026</p>
        <div class="orange-rule"></div>
      </div>
      <div class="hero-meta">
        Essex County, New Jersey
        <strong>Fiscal Year: 2026</strong>
      </div>
    </div>
  </header>

  <nav>
    <div class="wrap tabs" role="tablist" aria-label="Budget dashboard sections">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="delta">2025 vs 2026 Delta</button>
      <button class="tab" data-tab="taxImpact">Your Property Tax Impact</button>
      <button class="tab" data-tab="pilot">PILOT Program</button>
      <button class="tab" data-tab="capital">Capital Projects</button>
      <button class="tab" data-tab="spending">Spending Analysis</button>
      <button class="tab" data-tab="forecast">6-Year Forecast</button>
      <button class="tab" data-tab="changes">Change Orders</button>
    </div>
  </nav>

  <main class="wrap">
    <section class="stack" data-section="overview"></section>
    <section class="stack" data-section="delta" hidden></section>
    <section class="stack" data-section="taxImpact" hidden></section>
    <section class="stack" data-section="pilot" hidden></section>
    <section class="stack" data-section="capital" hidden></section>
    <section class="stack" data-section="spending" hidden></section>
    <section class="stack" data-section="forecast" hidden></section>
    <section class="stack" data-section="changes" hidden></section>
  </main>

  <script>
    const money = value => new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      maximumFractionDigits: 0
    }).format(value);

    const pct = value => `${value > 0 ? '+' : ''}${value.toFixed(2)}%`;
    const shortMoney = value => `$${(value / 1000000).toFixed(value >= 10000000 ? 1 : 2)}M`;

    const historicalTrend = [
      { year: 2020, total: 77636060, taxLevy: 51658519.05, nonTaxRevenue: 25503023, surplus: 4700000, debtService: 2241939 },
      { year: 2021, total: 79358417, taxLevy: 54801504.5, nonTaxRevenue: 24086710, surplus: 3700000, debtService: 2981982 },
      { year: 2022, total: 81720157.29, taxLevy: 56756859.3, nonTaxRevenue: 24431644.29, surplus: 3700000, debtService: 3474731 },
      { year: 2023, total: 88844923.41, taxLevy: 60801150.04, nonTaxRevenue: 27352735.41, surplus: 3000000, debtService: 3352875 },
      { year: 2024, total: 93280851, taxLevy: 64977993, nonTaxRevenue: 27550421, surplus: 4680000, debtService: 4236363 },
      { year: 2025, total: 92330788, taxLevy: 66890251, nonTaxRevenue: 23543038, surplus: 4000000, debtService: 4797620 },
      { year: 2026, total: 94580788, taxLevy: 70104881, nonTaxRevenue: 30901905, surplus: 4008400, debtService: 4306684 }
    ];

    const budgetComparison = [
      { category: 'Total Appropriations', y2025: 92330788, y2026: 94580788 },
      { category: 'Operations - Within CAP', y2025: 66272899, y2026: 64526480 },
      { category: 'Operations - Excluded CAP', y2025: 5876516, y2026: 11202060 },
      { category: 'Capital Improvements', y2025: 1500000, y2026: 1600000 },
      { category: 'Debt Service', y2025: 4797620, y2026: 4306684 }
    ].map(row => ({ ...row, change: row.y2026 - row.y2025, percent: ((row.y2026 - row.y2025) / row.y2025) * 100 }));

    const departmentComparison = [
      { name: 'Police', y2025: 17917872, y2026: 17246707 },
      { name: 'Fire', y2025: 9085400, y2026: 10043081 },
      { name: 'Public Works', y2025: 7912622, y2026: 7759162 },
      { name: 'Insurance', y2025: 22572000, y2026: 23857280 },
      { name: 'Finance', y2025: 2505000, y2026: 2400000 },
      { name: 'Library', y2025: 985343, y2026: 1117869 }
    ].map(row => ({ ...row, change: row.y2026 - row.y2025, percent: ((row.y2026 - row.y2025) / row.y2025) * 100 }));

    const revenueComparison = [
      { source: 'Surplus', y2025: 4000000, y2026: 4008400 },
      { source: 'Local Revenues', y2025: 2722147, y2026: 2651500 },
      { source: 'State Aid', y2025: 8472638, y2026: 8472638 },
      { source: 'UCC Fees', y2025: 940000, y2026: 1100000 },
      { source: 'PILOTs', y2025: 2664627, y2026: 2788300 },
      { source: 'Grants/Special', y2025: 150000, y2026: 6946352 }
    ].map(row => ({ ...row, change: row.y2026 - row.y2025, percent: row.y2025 ? ((row.y2026 - row.y2025) / row.y2025) * 100 : 0 }));

    const taxImpactAssumptions = {
      balconyUrl: 'https://app.balcony.technology/municipality/NJ-0717',
      municipalLevy2025: 66890251,
      municipalLevy2026: 70104881,
      generalTaxRate2025: 4.03,
      effectiveTaxRate2025: 3.765,
      estimatedTotalLevy2025: 89654326,
    };
    taxImpactAssumptions.estimatedTaxableBase = taxImpactAssumptions.estimatedTotalLevy2025 / (taxImpactAssumptions.generalTaxRate2025 / 100);
    taxImpactAssumptions.municipalRate2025 = taxImpactAssumptions.municipalLevy2025 / taxImpactAssumptions.estimatedTaxableBase * 100;
    taxImpactAssumptions.municipalRate2026 = taxImpactAssumptions.municipalLevy2026 / taxImpactAssumptions.estimatedTaxableBase * 100;
    taxImpactAssumptions.municipalRateChange = taxImpactAssumptions.municipalRate2026 - taxImpactAssumptions.municipalRate2025;
    taxImpactAssumptions.projectedGeneralTaxRate2026 = taxImpactAssumptions.generalTaxRate2025 + taxImpactAssumptions.municipalRateChange;
    taxImpactAssumptions.equalizationRatio = taxImpactAssumptions.effectiveTaxRate2025 / taxImpactAssumptions.generalTaxRate2025;
    taxImpactAssumptions.projectedEffectiveTaxRate2026 = taxImpactAssumptions.projectedGeneralTaxRate2026 * taxImpactAssumptions.equalizationRatio;

    const keyVariances = [
      { item: 'Workers Compensation Insurance', y2025: 1000000, y2026: 1500000, severity: 'red', note: 'Significant increase requiring investigation into claims experience vs. rate changes.' },
      { item: 'Court Fines', y2025: 1201676, y2026: 938800, severity: 'yellow', note: 'Lower anticipated fines reduce recurring local revenue.' },
      { item: 'Fire Department', y2025: 9085400, y2026: 10043081, severity: 'yellow', note: 'Increase reflects salary and benefits pressure.' },
      { item: 'Permit Fees', y2025: 439257, y2026: 553000, severity: 'green', note: 'Permit activity indicates stronger development activity.' },
      { item: 'Snow Removal Budget', y2025: 205000, y2026: 320000, severity: 'yellow', note: 'Higher budget improves winter weather preparedness.' },
      { item: 'Grant Revenues', y2025: 150000, y2026: 6946352, severity: 'green', note: 'Major state and federal grant acquisition success.' }
    ].map(row => ({ ...row, change: row.y2026 - row.y2025, percent: ((row.y2026 - row.y2025) / row.y2025) * 100 }));

    const pilotProperties = [
      ['Washington Dodd', 493727, 443700, 'Senior Housing'],
      ['Oakwood Towers', 274225, 243300, 'Senior Housing'],
      ['Our Lady of Mt. Carmel', 204354, 178300, 'Senior Housing'],
      ['Condos @ 52 Lincoln Ave', 153010, 138500, 'Mixed-Use'],
      ['Washington Dodd Settlement', 815000, 0, 'One-Time Settlement'],
      ['L & M Development Partners', 143668, 66600, 'Commercial'],
      ['Station Partners - Tony Galento', 250249, 21200, 'Mixed-Use'],
      ['Salem Towers', 175000, 175000, 'Senior Housing'],
      ['Transport of NJ', 107019, 107000, 'Commercial'],
      ['Orange Park Apartments', 237177, 200000, 'Residential'],
      ['S. Essex Urban Renewal', 99838, 90100, 'Urban Renewal'],
      ['Walter G Phase I', 58661, 62700, 'Mixed-Use'],
      ['Walter G Phase II', 38687, 35900, 'Mixed-Use'],
      ['Walter G Phase III', 34623, 33600, 'Mixed-Use'],
      ['Grand Central Senior Housing', 38496, 38400, 'Senior Housing'],
      ['Living Fountain', 73102, 65700, 'Mixed-Use'],
      ['Harvard Printing Development', 41871, 58200, 'Commercial'],
      ['606 Freeman Street', 115864, 127500, 'Commercial'],
      ['Essex & Crane', 59915, 69300, 'Commercial'],
      ['Peek Reock I', 33582, 33000, 'Commercial'],
      ['New Community Corp', 71910, 52500, 'Anchor Institution'],
      ['205 Mt. Vernon', 44529, 28900, 'Residential'],
      ['Condos @ 475 S. Jefferson', 77519, 84500, 'Commercial'],
      ['The Berkley, South Center', 27772, 35500, 'Anchor Institution'],
      ['307 Washington Street', 76956, 0, 'Phase-Out'],
      ['Peek Reock II', 75737, 0, 'Phase-Out'],
      ['Peek Reock III', 21008, 0, 'Phase-Out'],
      ['D&A Urban Renewal II - LIA', 39062, 0, 'Phase-Out']
    ].map(([name, y2025, y2026, type]) => {
      const percent = y2025 ? ((y2026 - y2025) / y2025) * 100 : 0;
      const status = y2026 === 0 && y2025 > 0 ? 'Discontinued' : percent > 1 ? 'Growing' : percent < -2 ? 'Declining' : 'Stable';
      return { name, y2025, y2026, type, change: y2026 - y2025, percent, status };
    });

    const capitalProjects = [
      { name: 'Road Improvements', category: 'Infrastructure', total: 5000000, budget2026: 250000, status: 'Active', years: 6, description: 'Multi-year street resurfacing and infrastructure upgrades across the city.' },
      { name: 'Water/Sewer System Improvements', category: 'Utilities', total: 6900000, budget2026: 5400000, status: 'Priority', years: 6, description: 'Comprehensive water and sewer infrastructure modernization.' },
      { name: 'DPW Projects - OPD/Courts', category: 'Municipal Facilities', total: 2667000, budget2026: 133350, status: 'Active', years: 1, description: 'Police Department and Courts building improvements.' },
      { name: 'Fire Department Radios', category: 'Equipment', total: 300000, budget2026: 15000, status: 'Active', years: 1, description: 'Communications equipment upgrade for fire operations.' },
      { name: 'DPW Projects - City Hall', category: 'Municipal Facilities', total: 410000, budget2026: 20500, status: 'Planning', years: 1, description: 'City Hall facility upgrades and maintenance.' }
    ];

    const sixYearProjection = [
      { year: '2026', general: 4327000, waterSewer: 5400000, total: 9727000 },
      { year: '2027', general: 1000000, waterSewer: 300000, total: 1300000 },
      { year: '2028', general: 1000000, waterSewer: 300000, total: 1300000 },
      { year: '2029', general: 1000000, waterSewer: 300000, total: 1300000 },
      { year: '2030', general: 1000000, waterSewer: 300000, total: 1300000 },
      { year: '2031', general: 1000000, waterSewer: 300000, total: 1300000 }
    ];

    const departmentSpending = [
      { name: 'Police', amount: 17967872, percentage: 22.8 },
      { name: 'Fire', amount: 10038481, percentage: 12.8 },
      { name: 'Insurance', amount: 23857280, percentage: 30.4 },
      { name: 'Public Works', amount: 8202122, percentage: 10.4 },
      { name: 'Administration', amount: 5834562, percentage: 7.4 },
      { name: 'Other Services', amount: 6484935, percentage: 8.2 }
    ];

    const revenueSources = [
      { name: 'Property Tax', value: 70104881, color: '#003d7a' },
      { name: 'State Aid', value: 8472638, color: '#005fa3' },
      { name: 'Miscellaneous', value: 11968449, color: '#f97316' },
      { name: 'Surplus', value: 4008400, color: '#fb923c' },
      { name: 'Grants/Other', value: 26400, color: '#fdba74' }
    ];

    const changeOrders = [
      { project: 'NJDOT 2020 Roadway Improvements', contractor: 'Cifelli & Son General Construction', original: 518882.39, increase: 112731.92, percentage: 21.7, scope: 'Additional concrete sidewalk, milling, paving on North Day, Hillyer, Hickory Streets, plus traffic directors.' },
      { project: 'Public Works Garage Roof Removal & Replacement', contractor: 'Weatherproof Technologies, Inc.', original: 370747.83, increase: 75781.45, percentage: 20.4, scope: 'HVAC, ladder installation, new door, NJ Transit training, metal deck replacement, and split unit.' },
      { project: '2022 Safe Streets to Transit', contractor: 'Portofino Builders, LLC', original: 229535, increase: 113319.6, percentage: 49.4, scope: 'Additional conduit, PSE&G hand hole, drainage changes, intersection paving, curb installation, tree removal and replacement.' }
    ];

    const sections = Object.fromEntries([...document.querySelectorAll('[data-section]')].map(el => [el.dataset.section, el]));

    const icon = (name, cls = 'icon orange') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const metric = ({ label, value, note, yoy, iconName, color = 'orange' }) => `
      <article class="metric">
        <div class="metric-top">
          <span class="label">${label}</span>
          ${icon(iconName, `icon ${color}`)}
        </div>
        <div class="value">${value}</div>
        <p class="note">${note}</p>
        <div class="yoy ${color}">${yoy}</div>
      </article>
    `;

    const table = (headers, rows) => `
      <table>
        <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    `;

    const signed = row => `<span class="${row.change >= 0 ? 'orange' : 'blue'}">${row.change >= 0 ? '+' : ''}${money(row.change)} (${pct(row.percent)})</span>`;

    sections.overview.innerHTML = `
      <div class="grid metrics">
        ${metric({ label: 'Total Appropriations', value: money(94580788), note: '2026 Municipal Budget', yoy: `+${money(2250000)} (+2.44%) from 2025`, iconName: 'dollar-sign' })}
        ${metric({ label: 'Tax Levy', value: money(70104881), note: 'Amount to be raised by property tax', yoy: `+${money(3214630)} (+4.81%) from 2025`, iconName: 'trending-up', color: 'blue' })}
        ${metric({ label: 'Miscellaneous Revenue', value: money(19400638), note: 'Licenses, fees, state aid, grants', yoy: `+${money(7350467)} (+37.88%) from 2025`, iconName: 'building-2', color: 'green' })}
        ${metric({ label: 'Surplus Balance', value: money(4008400), note: 'Anticipated surplus for 2026', yoy: `+${money(8400)} (+0.21%) from 2025`, iconName: 'alert-circle', color: 'yellow' })}
      </div>
      <div class="grid two">
        <div class="panel">
          <h2 class="panel-title">${icon('pie-chart', 'icon orange')} Revenue Sources</h2>
          <div class="chart-box"><canvas id="revenuePie"></canvas></div>
        </div>
        <div class="panel">
          <h2 class="panel-title">${icon('bar-chart-3', 'icon blue')} Top Department Allocations</h2>
          ${departmentSpending.map(d => `
            <div style="margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:.92rem">
                <strong>${d.name}</strong><strong>${money(d.amount)}</strong>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${d.percentage}%"></div></div>
              <p class="note">${d.percentage}% of municipal spending</p>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="panel">
        <h2 class="panel-title">${icon('activity', 'icon green')} Long-Term Budget Trend</h2>
        <div class="chart-box tall"><canvas id="historicalTrend"></canvas></div>

    function parseAssessedValue(raw) {
      return Number(String(raw || '').replace(/[^0-9.]/g, '')) || 0;
    }

    function updateTaxImpact(rawValue) {
      const assessedValue = parseAssessedValue(rawValue);
      const bill2025 = assessedValue * taxImpactAssumptions.generalTaxRate2025 / 100;
      const bill2026 = assessedValue * taxImpactAssumptions.projectedGeneralTaxRate2026 / 100;
      const change = bill2026 - bill2025;
      const changePct = bill2025 ? (change / bill2025) * 100 : 0;

      document.getElementById('taxBill2025').textContent = money(bill2025);
      document.getElementById('taxBill2026').textContent = money(bill2026);
      document.getElementById('taxBillChange').textContent = `${change >= 0 ? '+' : ''}${money(change)}`;
      document.getElementById('taxBillChangePct').textContent = `${change >= 0 ? '+' : ''}${changePct.toFixed(2)}% vs. estimated 2025 bill`;
      document.getElementById('effectiveRateResult').textContent = `${taxImpactAssumptions.projectedEffectiveTaxRate2026.toFixed(3)}%`;
      document.getElementById('formulaAssessment').textContent = money(assessedValue);
    }

    document.getElementById('assessedValueInput').addEventListener('input', event => updateTaxImpact(event.target.value));

      updateTaxImpact('350000');

    document.getElementById('sampleHome500').addEventListener('click', () => {
